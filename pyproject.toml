[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paper_workbench"
version = "0.5.0"
description = "Rule-based writing checks for LaTeX papers: a customizable rule tree, sentence/paragraph/document rules, and offline reports."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["spacy>=3.7,<4"]

[project.optional-dependencies]
figures = ["pymupdf>=1.23"]
workbench = ["pymupdf>=1.23"]

[project.scripts]
paper_workbench = "paper_workbench.cli:main"
paperrules = "paper_workbench.cli:main"   # the name before 0.5.0

[tool.setuptools]
packages = ["paper_workbench", "paper_workbench.workbench", "paperrules"]

[tool.setuptools.package-data]
paper_workbench = ["packs/*/*.json"]
"paper_workbench.workbench" = ["template/*"]
