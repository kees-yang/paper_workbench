<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>__TITLE__</title>
<style>
:root{--bg:#fbfaf8;--panel:#ffffff;--ink:#1d1d1f;--ink2:#55565c;--mute:#8a8b91;--line:#e4e2dd;--acc:#2f6fb3;--acc2:#e9f1fa;--warn:#a5541b;--warnbg:#fbefe4;--ok:#2d7a4b;--okbg:#e8f4ec;--hl:rgba(242,194,0,.28);--chip:#f1efea;--uS:#2f6fb3;--uP:#c8433a;--uO:#2d8a52;--lp:rgba(47,111,179,.13)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17181a;--panel:#1f2023;--ink:#ececee;--ink2:#b5b6bb;--mute:#86878d;--line:#33343a;--acc:#7fb0e6;--acc2:#1f2b3a;--warn:#e6a06a;--warnbg:#3a2a1c;--ok:#7cc796;--okbg:#1c3226;--hl:rgba(242,194,0,.22);--chip:#2a2b30;--uS:#7fb0e6;--uP:#f08a80;--uO:#7cc796;--lp:rgba(127,176,230,.2)}}
:root[data-theme="dark"]{--bg:#17181a;--panel:#1f2023;--ink:#ececee;--ink2:#b5b6bb;--mute:#86878d;--line:#33343a;--acc:#7fb0e6;--acc2:#1f2b3a;--warn:#e6a06a;--warnbg:#3a2a1c;--ok:#7cc796;--okbg:#1c3226;--hl:rgba(242,194,0,.22);--chip:#2a2b30;--uS:#7fb0e6;--uP:#f08a80;--uO:#7cc796;--lp:rgba(127,176,230,.2)}
*{box-sizing:border-box}html,body{margin:0;height:100%}body{display:flex;flex-direction:column;background:var(--bg);color:var(--ink);font:13px/1.45 -apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif}
header{display:flex;gap:10px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:5;flex-wrap:wrap}
header h1{font-size:14px;margin:0 8px 0 0;font-weight:600}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}.seg button{border:0;background:transparent;color:var(--ink2);padding:5px 10px;cursor:pointer;font:inherit}
.seg button[aria-pressed=true]{background:var(--acc2);color:var(--acc);font-weight:600}
input[type=search]{border:1px solid var(--line);border-radius:7px;padding:5px 8px;background:var(--bg);color:var(--ink);min-width:260px}
label.t{color:var(--ink2);display:inline-flex;gap:4px;align-items:center;cursor:pointer}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:7px;padding:5px 10px;cursor:pointer;font:inherit}
.stats{margin-left:auto;color:var(--mute);font-size:12px}
main{display:grid;grid-template-columns:230px minmax(0,1fr) minmax(0,38%);flex:1;min-height:0}
main.nopage{grid-template-columns:230px minmax(0,1fr) 0}
nav{border-right:1px solid var(--line);overflow:auto;padding:6px 0;background:var(--panel)}
nav .ch{font-weight:600;color:var(--ink2);padding:8px 12px 2px;font-size:12px}
nav a{display:flex;gap:6px;padding:3px 12px;color:var(--ink);text-decoration:none;cursor:pointer;font-size:12px}
nav a .pid{color:var(--mute);font-variant-numeric:tabular-nums}nav a[aria-current=true]{background:var(--acc2);color:var(--acc)}
nav a .dot{margin-left:auto;width:7px;height:7px;border-radius:50%;background:transparent;align-self:center}nav a .dot.w{background:var(--warn)}nav a .dot.n{background:var(--acc)}
#mid{overflow-y:auto;overflow-x:hidden;padding:12px 16px}#pg{overflow:auto;border-left:1px solid var(--line);background:var(--bg);padding:8px}
.ph{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:10px 12px;margin-bottom:10px}
.ph .crumb{color:var(--mute);font-size:12px}.ph h2{font-size:15px;margin:2px 0 6px}
.ph dl{display:grid;grid-template-columns:76px 1fr;gap:3px 10px;margin:0}.ph dt{color:var(--mute)}.ph dd{margin:0}
table.s{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);border-radius:9px;overflow:hidden}
table.s th{font-size:11px;text-align:left;color:var(--mute);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line);background:var(--bg)}
table.s td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
table.s tr:last-child td{border-bottom:0}table.s tr.sel td{background:var(--acc2)}
td.n{color:var(--mute);font-variant-numeric:tabular-nums;width:34px;white-space:nowrap}
td.tx .en{color:var(--ink)}td.tx .zh{color:var(--ink2);font-size:12px;margin-top:2px}.hidezh td.tx .zh{display:none}
td.lk{width:34%;font-size:12px}
.link{display:grid;grid-template-columns:auto 1fr;gap:2px 6px;align-items:baseline}
.rel{display:inline-block;padding:0 6px;border-radius:9px;background:var(--chip);color:var(--ink2);font-size:11px;white-space:nowrap}
.rel.none{background:var(--warnbg);color:var(--warn)}.rel.earl{background:var(--acc2);color:var(--acc)}
.q{color:var(--ink2)}.q b{color:var(--ink);font-weight:600}.arrow{color:var(--mute)}
.jump{color:var(--acc);cursor:pointer;font-variant-numeric:tabular-nums}
.note{width:100%;margin-top:4px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit;font-size:12px;padding:4px 6px;min-height:28px;resize:vertical}
.has-note td.n::after{content:"✎";color:var(--warn);margin-left:3px}
.pgwrap{position:relative;margin:0 auto 10px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.15)}.pgwrap img{display:block;width:100%}
.box{position:absolute;background:var(--hl);border:1.5px solid #F2C200;border-radius:2px;pointer-events:none}
.pglabel{color:var(--mute);font-size:11px;text-align:center;margin:-6px 0 10px}
.tab{display:none}.tab.on{display:block}
table.ab{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line)}table.ab td,table.ab th{padding:5px 8px;border-bottom:1px solid var(--line);text-align:left;font-size:12px;vertical-align:top}
.st{padding:0 6px;border-radius:9px;font-size:11px}.st.undefined{background:var(--warnbg);color:var(--warn)}.st.defined{background:var(--okbg);color:var(--ok)}.st.name{background:var(--chip);color:var(--ink2)}
.fl td,.fl th{font-size:12px}.fl td{min-width:120px}.pj{color:var(--acc);cursor:pointer;font-variant-numeric:tabular-nums;white-space:nowrap}
.ck{display:inline-block;padding:0 5px;border-radius:8px;font-size:10.5px;margin:1px 2px 0 0}.ck.pass{background:var(--okbg);color:var(--ok)}.ck.minor{background:var(--warnbg);color:var(--warn)}.ck.major{background:var(--warn);color:var(--panel)}
.seq{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin:4px 0}.seq .s{padding:1px 7px;border-radius:9px;background:var(--chip);font-size:11.5px}.seq .a{color:var(--mute)}
.spo{text-decoration-line:underline;text-decoration-thickness:2px;text-underline-offset:3px;text-decoration-skip-ink:none}.spo.S{text-decoration-color:var(--uS)}.spo.P{text-decoration-color:var(--uP)}.spo.O{text-decoration-color:var(--uO)}
.lp{background:var(--lp);border-radius:3px;padding:0 1px}b.hn{font-weight:700}.lk .lp{font-weight:600}
.spo-legend{color:var(--mute);font-size:12px;margin:0 0 6px}.spo-legend .spo{color:var(--ink2)}
.legend{color:var(--mute);font-size:12px;margin:0 0 8px}mark{background:var(--hl);color:inherit}
@media (max-width:900px){main,main.nopage{grid-template-columns:1fr;height:auto}nav,#pg{display:none}}
</style></head><body>
<header>
 <h1>__TITLE__</h1>
 <div class="seg" id="papers"></div>
 <div class="seg" id="views"><button data-v="sent" aria-pressed="true">Sentences</button><button data-v="abbr">Abbreviations</button><button data-v="flow">Flow</button><button data-v="notes">Notes</button><button data-v="scores">Scores</button></div>
 <input type="search" id="q" placeholder="Search sentences, English or 中文">
 <label class="t"><input type="checkbox" id="zh" checked> 中文</label>
 <label class="t"><input type="checkbox" id="page" checked> Page</label>
 <button class="btn" id="exp">Export notes</button>
 <span class="stats" id="stats"></span>
</header>
<main id="main"><nav id="nav"></nav><section id="mid"></section><aside id="pg"></aside></main>
<script type="application/json" id="data">__DATA__</script>
<script type="application/json" id="scores">__SCORES__</script>
<script>
const DATA=JSON.parse(document.getElementById('data').textContent);
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let pi=0, view='sent', cur=null, sel=null, query='';
const store={get(k){try{return localStorage.getItem(k)||''}catch(e){return ''}},set(k,v){try{v?localStorage.setItem(k,v):localStorage.removeItem(k)}catch(e){}}};
const nk=(p,id)=>'wbnote|'+p.name+'|'+p.version+'|'+id;
function P(){return DATA[pi]}
function paperTabs(){$('#papers').innerHTML=DATA.map((p,i)=>`<button data-i="${i}" aria-pressed="${i===pi}" title="${esc(p.title)}">${esc(p.name)} · ${esc(p.version)}</button>`).join('');
 document.querySelectorAll('#papers button').forEach(b=>b.onclick=()=>{pi=+b.dataset.i;cur=null;sel=null;render()})}
function stats(){const s=P().stats;$('#stats').textContent=`${s.rows} sentences · ${s.paras} paragraphs · link to previous ${s.prev} · earlier links ${s.earl} · ${s.undefined} undefined abbreviations`}
function nav(){const p=P();let h='',ch='';const nlink=pp=>pp.rows.some(r=>p.R[r]&&!p.R[r].prev&&pp.rows.indexOf(r)>0);
 for(const pp of p.P){if(pp.ch!==ch){ch=pp.ch;h+=`<div class="ch">${esc(ch)}</div>`}
  const hasNote=pp.rows.some(r=>store.get(nk(p,r)));
  h+=`<a data-p="${pp.id}" aria-current="${pp.id===cur}"><span class="pid">${pp.id.slice(1)}</span><span>${esc(pp.title||pp.sec)}</span><span class="dot ${hasNote?'n':nlink(pp)?'w':''}" title="${hasNote?'has notes':nlink(pp)?'a sentence without a link to the previous one':''}"></span></a>`}
 $('#nav').innerHTML=h;document.querySelectorAll('#nav a').forEach(a=>a.onclick=()=>{cur=a.dataset.p;sel=null;view='sent';render()})}
function hl(t){if(!query)return esc(t);const i=t.toLowerCase().indexOf(query.toLowerCase());return i<0?esc(t):esc(t.slice(0,i))+'<mark>'+esc(t.slice(i,i+query.length))+'</mark>'+esc(t.slice(i+query.length))}
// Sentence marks: coloured underlines for the subject (S), predicate (P) and object (O) of each clause; a tint for the phrase that
// links to the previous sentence or to earlier text (in this sentence) and for the phrase it picks up (in the anchor sentence); head noun bold.
function marked(text,spans,links){text=String(text||'');const n=text.length,role=new Array(n).fill(''),lk=new Array(n).fill(null),hd=new Array(n).fill(false);
 (spans||[]).forEach(([a,b,t])=>{for(let i=Math.max(0,a);i<Math.min(n,b);i++)if(!role[i])role[i]=t});
 (links||[]).forEach(L=>{for(let i=L.s;i<L.e;i++)lk[i]=L;if(L.h){const j=L.q.lastIndexOf(L.h);if(j>=0)for(let i=L.s+j;i<L.s+j+L.h.length;i++)hd[i]=true}});
 let o='',i=0;while(i<n){const L=lk[i];let j=i;while(j<n&&lk[j]===L)j++;let inner='',k=i;
  while(k<j){let m=k;while(m<j&&role[m]===role[k]&&hd[m]===hd[k])m++;let t=esc(text.slice(k,m));if(hd[k])t='<b class="hn">'+t+'</b>';if(role[k])t=`<span class="spo ${role[k]}">${t}</span>`;inner+=t;k=m}
  o+=L?`<span class="lp" title="${esc(L.t||'')}">${inner}</span>`:inner;i=j}
 return o}
function phrases(text,list){const rs=[];text=String(text||'');for(const x of list){if(!x.q)continue;const i=text.indexOf(x.q),e=i+x.q.length;if(i>=0&&!rs.some(r=>i<r.e&&e>r.s))rs.push({s:i,e,q:x.q,h:x.h,t:x.t})}return rs}
function linkMarks(p,id,which){const r=p.R[id],L=[];if(!r)return L;
 for(const k of ['prev','earl']){const x=r[k];if(x)L.push({q:x.target_quote,h:x.target_head,t:'links to '+x.anchor_id})}
 for(const a of (p.anchorsOf||{})[id]||[])L.push({q:a.anchor_quote,h:a.anchor_head,t:'picked up by '+a.by});
 return L}
const SPO_LEGEND='<div class="spo-legend"><span class="spo S">subject</span> <span class="spo P">predicate</span> <span class="spo O">object</span> · <span class="lp">tint</span>: the phrase that links two sentences, at both ends · <b>bold</b>: its head noun · hover a tint for its partner sentence</div>';
function anchors(p){if(p.anchorsOf)return;const A={};for(const[id,r]of Object.entries(p.R))for(const k of ['prev','earl']){const x=r[k];if(x&&x.anchor_id)(A[x.anchor_id]=A[x.anchor_id]||[]).push({anchor_quote:x.anchor_quote,anchor_head:x.anchor_head,by:id})}p.anchorsOf=A}
function linkCell(p,id,r,i){let h='';
 if(r.prev){h+=`<div class="link"><span class="rel">${esc(r.prev.relation||'link')}</span><span class="q"><span class="jump" data-j="${r.prev.anchor_id}">${r.prev.anchor_id.slice(5)}</span> <span class="lp">${esc(r.prev.anchor_quote)}</span> <span class="arrow">→</span> <span class="lp">${esc(r.prev.target_quote)}</span></span></div>`}
 else if(i>0){h+=`<div class="link"><span class="rel none">no link</span><span class="q">does not pick up the previous sentence</span></div>`}
 else{h+=`<div class="link"><span class="rel">opens</span><span class="q">first sentence of the paragraph</span></div>`}
 if(r.earl){h+=`<div class="link" style="margin-top:3px"><span class="rel earl">${esc(r.earl.relation||'earlier')}</span><span class="q"><span class="jump" data-j="${r.earl.anchor_id}">${r.earl.anchor_id}</span> <span class="lp">${esc(r.earl.anchor_quote)}</span> <span class="arrow">→</span> <span class="lp">${esc(r.earl.target_quote)}</span></span></div>`}
 return h}
function rowsTable(p,ids){anchors(p);return SPO_LEGEND+`<table class="s"><thead><tr><th>#</th><th>Sentence</th><th>Link to the previous sentence · earlier link</th></tr></thead><tbody>`+
 ids.map((id,i)=>{const r=p.R[id];if(!r)return '';const note=store.get(nk(p,id));
 return `<tr id="r-${id}" data-id="${id}" class="${sel===id?'sel':''} ${note?'has-note':''}"><td class="n">${id.slice(5)}</td><td class="tx"><div class="en">${query?hl(r.en):marked(r.en,r.spo,phrases(r.en,linkMarks(p,id)))}</div><div class="zh">${query?hl(r.zh):marked(r.zh,r.spz,phrases(r.zh,linkMarks(p,id)))}</div>${sel===id?`<textarea class="note" data-n="${id}" placeholder="Note on this sentence">${esc(note)}</textarea>`:''}</td><td class="lk">${linkCell(p,id,r,i)}</td></tr>`}).join('')+'</tbody></table>'}
function sentView(){const p=P();
 if(query){const ids=Object.keys(p.R).filter(id=>(p.R[id].en+' '+p.R[id].zh).toLowerCase().includes(query.toLowerCase()));
  $('#mid').innerHTML=`<div class="legend">${ids.length} sentences match “${esc(query)}”.</div>`+rowsTable(p,ids);bindRows();return}
 const pp=p.P.find(x=>x.id===cur)||p.P[0];cur=pp.id;
 const i=p.P.indexOf(pp);
 $('#mid').innerHTML=`<div class="ph"><div class="crumb">${esc(pp.ch)} · ${esc(pp.sec)} · ${pp.id}</div><h2>${esc(pp.title||'(untitled paragraph)')}</h2><dl>
 ${pp.q?`<dt>Question</dt><dd>${esc(pp.q)}</dd>`:''}<dt>Claim</dt><dd>${esc(pp.claim||'—')}</dd><dt>Follows</dt><dd class="q">${esc(pp.prev||'—')}</dd></dl></div>`+rowsTable(p,pp.rows)+
 `<div style="display:flex;justify-content:space-between;margin-top:8px"><button class="btn" id="pp" ${i?'':'disabled'}>‹ Previous paragraph</button><button class="btn" id="np" ${i<p.P.length-1?'':'disabled'}>Next paragraph ›</button></div>`;
 $('#pp').onclick=()=>{cur=p.P[i-1].id;sel=null;render()};$('#np').onclick=()=>{cur=p.P[i+1].id;sel=null;render()};bindRows();page(pp)}
function bindRows(){document.querySelectorAll('table.s tr[data-id]').forEach(tr=>tr.onclick=e=>{if(e.target.closest('textarea,.jump'))return;sel=tr.dataset.id;if(query){cur=P().R[sel].p;query='';$('#q').value=''}render();const t=document.querySelector('textarea.note');t&&t.focus()});
 document.querySelectorAll('.jump').forEach(j=>j.onclick=()=>{const id=j.dataset.j,r=P().R[id];if(!r)return;cur=r.p;sel=id;query='';$('#q').value='';render();document.getElementById('r-'+id)?.scrollIntoView({block:'center'})});
 document.querySelectorAll('textarea.note').forEach(t=>t.oninput=()=>{store.set(nk(P(),t.dataset.n),t.value.trim());t.closest('tr').classList.toggle('has-note',!!t.value.trim())})}
function page(pp){const p=P(),el=$('#pg');if(!$('#page').checked){el.innerHTML='';return}
 const pages=[...new Set((pp.areas||[]).map(a=>a.page))];if(!pages.length){el.innerHTML='<div class="legend">This paragraph is not located on a PDF page.</div>';return}
 el.innerHTML=pages.map(n=>{const d=p.dims[n-1]||{width:612,height:792},src=p.imgs[n-1]||'';
  const boxes=pp.areas.filter(a=>a.page===n).map(a=>{const[x0,y0,x1,y1]=a.rect;return `<div class="box" style="left:${x0/d.width*100}%;top:${y0/d.height*100}%;width:${(x1-x0)/d.width*100}%;height:${(y1-y0)/d.height*100}%"></div>`}).join('');
  return `<div class="pgwrap"><img src="${src}" alt="Page ${n}">${boxes}</div><div class="pglabel">Page ${n}</div>`}).join('');
 const b=el.querySelector('.box');b&&b.scrollIntoView({block:'center'})}
function abbrView(){const p=P();const order={undefined:0,defined:1,name:2};const L=[...p.abbr].sort((a,b)=>order[a.status]-order[b.status]||a.scope.localeCompare(b.scope));
 $('#pg').innerHTML='';$('#mid').innerHTML=`<div class="legend">First use of each abbreviation in each scope (Abstract, Body, Supplement). <span class="st undefined">undefined</span> needs a definition at this first use. <span class="st name">name</span> is a dataset, method or tool name. The check is automatic, so read each flagged sentence.</div>
 <table class="ab"><thead><tr><th>Status</th><th>Abbreviation</th><th>Scope</th><th>Uses</th><th>First sentence</th></tr></thead><tbody>${L.map(x=>`<tr><td><span class="st ${x.status}">${x.status}</span></td><td><b>${esc(x.abbr)}</b></td><td>${x.scope}</td><td>${x.n}</td><td><span class="jump" data-j="${x.row}">${x.row}</span> ${esc(x.text)}</td></tr>`).join('')}</tbody></table>`;bindRows()}
const PART={background:/background|state of the art|current state|context|necessity|研究现状|背景|现状|必要/i,related:/related|prior work|existing|相关工作|现有/i,
 question:/problem|gap|question|challenge|limitation|不足|问题|挑战|局限/i,motivation:/motivation|insight|observation|thesis|idea|动机|观察|论点|洞察/i,
 method:/method|approach|propos|design|方法|提出|设计/i,contribution:/contribution|novel|贡献|创新/i,result:/result|finding|evidence|experiment|结果|实验|证据/i};
const CHAP=[['Introduction',/introduction|引言|绪论/i],['Related work',/related|相关工作/i],['Method',/method|approach|方法/i],['Experiments',/experiment|result|evaluation|实验|结果/i],['Conclusion',/conclusion|结论|总结/i]];
function partOf(pp){if(pp.kind==='abstract')return 'Abstract';const r=P().R[pp.rows[0]];if(r&&r.s)return 'Supplement';for(const[n,rx]of CHAP)if(rx.test(pp.ch))return n;return 'Body'}
const pj=id=>`<span class="pj" data-pj="${id}">${id}</span>`, ck=c=>Object.entries(c||{}).map(([k,v])=>`<span class="ck ${v[0]}" title="${esc(v[1]||'')}">${esc(k)}</span>`).join('');
function flowView(){const p=P(),F=p.flow||{};$('#pg').innerHTML='';
 if(!(F.slots||[]).length&&!(F.lines||[]).length){$('#mid').innerHTML='<div class="legend">This page has no flow data. Write the abstract slots, the conclusion and the storyline in the annotation file (workbench.json) and rebuild the workbench.</div>';return}
 const parts=Object.fromEntries(p.P.map(pp=>[pp.id,partOf(pp)])),slotTxt=s=>[s.name,s.name_zh,s.scope].join(' ');
 const servesSlot=(pp,s)=>(pp.serves||[]).some(x=>x===s.id||String(x).startsWith(s.id+'.'));
 const mirrors=(c,s)=>(c.mirrors||[]).some(x=>x===s.id||String(x).startsWith(s.id+'.'));
 // 1. skeleton
 let h=`<div class="ph"><h2>The paper as one shortcut</h2><div class="legend">Each abstract slot, then the paragraphs that expand it in the introduction and the body, and the conclusion items that answer it. A gap in a row is a part of the abstract that the paper does not carry through.</div>
 <table class="ab fl"><thead><tr><th>Abstract slot</th><th>Introduction</th><th>Body</th><th>Conclusion</th></tr></thead><tbody>`;
 for(const s of F.slots){const intro=p.P.filter(pp=>parts[pp.id]==='Introduction'&&servesSlot(pp,s)),body=p.P.filter(pp=>!['Abstract','Introduction','Conclusion'].includes(parts[pp.id])&&servesSlot(pp,s)),con=(F.conclusion||[]).filter(c=>mirrors(c,s));
  const cell=L=>L.length?L.map(pp=>`${pj(pp.id)} <span class="q">${esc(pp.move||pp.title||'')}</span>`).join('<br>'):'<span class="rel none">none</span>';

 ${(F.lines||[]).map(L=>`<h3 style="font-size:13px;margin:10px 0 2px">${esc(L.id)} · ${esc(L.name)}</h3><div class="q">${esc(L.story)}</div>

function scoresView(){const S=JSON.parse(document.getElementById('scores').textContent||'{}');$('#pg').innerHTML='';if(!S.rounds||!S.rounds.length){$('#mid').innerHTML='<div class="legend">No score log. Build the page with <code>--scores score_log.json</code> to track review rounds (format in docs/review.md).</div>';return}
 const R=S.rounds,lines=[...new Set(R.map(r=>r.line||'paper'))],pal=['var(--acc)','#d9822b','#2d7a4b','#8a5bc4','#6b6d73'],col=Object.fromEntries(lines.map((l,i)=>[l,pal[i%pal.length]]));
 const sc=R.map(r=>+r.score),tg=S.target!=null?+S.target:null,lo=Math.max(0,Math.floor(Math.min(...sc,tg??99)-1)),hi=Math.min(S.max??10,Math.ceil(Math.max(...sc,tg??0)+0.5));
 const W=760,H=230,L=44,B=34,T=14,y=v=>T+(hi-v)/Math.max(1,hi-lo)*(H-T-B),x=i=>L+i*(W-L-14)/Math.max(1,R.length-1);let g='';

 R.forEach((r,i)=>{if(i&&r.model&&R[i-1].model&&r.model!==R[i-1].model){const m=(x(i-1)+x(i))/2;g+=`<line x1="${m}" x2="${m}" y1="${T}" y2="${H-B}" stroke="var(--mute)" stroke-dasharray="2 3"/><text x="${m+4}" y="${T+10}" font-size="10" fill="var(--mute)">reviewer: ${esc(r.model)}</text>`}});
 for(const ln of lines){const pts=R.map((r,i)=>[r,i]).filter(([r])=>(r.line||'paper')===ln);

 ${(S.bottlenecks||[]).length?`<h3 style="font-size:14px">Bottlenecks</h3><table class="ab"><thead><tr><th>Issue</th><th>Raised in</th><th>Status</th><th>Evidence now</th></tr></thead><tbody>${S.bottlenecks.map(b=>`<tr><td><b>${esc(b.issue)}</b></td><td>${esc(b.rounds||'')}</td><td><span class="st ${/^Open/i.test(b.status||'')?'undefined':/^Addressed/i.test(b.status||'')?'defined':'name'}">${esc(b.status||'')}</span></td><td>${esc(b.evidence||'')}</td></tr>`).join('')}</tbody></table>`:''}`}
